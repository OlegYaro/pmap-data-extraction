name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: extraction
          POSTGRES_PASSWORD: extraction
          POSTGRES_DB: extraction_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U extraction"
          --health-interval 5s
          --health-retries 10
    env:
      DB_URL: postgresql+asyncpg://extraction:extraction@localhost:5432/extraction_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry==2.4.1 && poetry install
      - run: poetry run ruff check . && poetry run ruff format --check .
      - run: poetry run alembic upgrade head
      - run: poetry run pytest

  deploy:
    name: deploy to AWS (dev)
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      - name: Deploy (image, stop, migrations, start)
        run: make deploy
