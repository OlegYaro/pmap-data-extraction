services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: extraction
      POSTGRES_USER: extraction
      POSTGRES_PASSWORD: extraction
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extraction"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DB_URL: postgresql+asyncpg://extraction:extraction@db:5432/extraction
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
