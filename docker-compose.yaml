services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: extraction
      POSTGRES_USER: extraction
      POSTGRES_PASSWORD: extraction
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extraction"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    volumes: ["./data:/app/data"]
    environment:
      DOWNLOAD_DIR: /app/data/rcn

  worker:
    build: .
    command: taskiq worker jobs.broker:broker jobs.tasks --workers 1 --max-async-tasks 4
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    volumes: ["./data:/app/data"]
    environment:
      DOWNLOAD_DIR: /app/data/rcn

  scheduler:
    build: .
    command: taskiq scheduler jobs.broker:scheduler jobs.tasks
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
