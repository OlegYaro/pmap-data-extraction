AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets the deploy job of GitHub Actions update the extraction stack without
  AWS keys in GitHub: GitHub signs in through OIDC and gets a role that can
  only push the image, run the migrations and hand the stack update to
  CloudFormation.

Parameters:
  Project:
    Type: String
    Default: pmap
  Env:
    Type: String
    Default: dev
  GitHubRepo:
    Type: String
    Default: OlegYaro/pmap-data-extraction
    Description: owner/name, case-sensitive.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      false if the account already has the provider
      token.actions.githubusercontent.com (one per account).

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # CloudFormation acts as this role when the deploy job updates the stack, so
  # the GitHub role itself cannot change IAM, ECS or secrets directly. Its name
  # is fixed: .github/workflows/ci.yml builds its ARN.
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-${Env}-cloudformation"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-${Env}-github-deploy"
      MaxSessionDuration: 3600
      # Only jobs in the GitHub environment Env of this repository; the
      # environment allows only main.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:environment:${Env}"
      Policies:
        - PolicyName: deploy-extraction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: UpdateTheStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Project}-${Env}-extraction/*"
              - Sid: ReadExports
                Effect: Allow
                Action: cloudformation:ListExports
                Resource: "*"
              - Sid: HandTheUpdateToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushTheImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Project}-${Env}-extraction"
              - Sid: RunTheMigrations
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${Project}-${Env}-extraction-worker:*"
              - Sid: PassTheTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-${Env}-extraction-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: CheckTheServices
                Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: Value of the GitHub variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
